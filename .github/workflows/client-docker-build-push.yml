name: Build and Push Client Image

on:
  push:
    branches: [prod, develop]
  pull_request:
    branches: [prod]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: tkx-client

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Verify build context
        run: |
          echo "Current working directory:"
          pwd
          echo "Listing root directory:"
          ls -la
          echo "Checking Dockerfile:"
          ls -la Dockerfile || echo "ERROR: Dockerfile not found!"
          echo "Verifying workflow file content:"
          cat .github/workflows/client-docker-build-push.yml | grep -A 5 "Build and push Docker image" || echo "Workflow file check"
          echo "NEXT_PUBLIC_TURNSTILE_SITE_KEY will be set to: 0x4AAAAAACCqcSwjNT3mbAl3"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://api.taikhoanxin.com
            NEXT_PUBLIC_SITE_URL=https://taikhoanxin.com
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=0x4AAAAAACCqcSwjNT3mbAl3
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=119533996226-shm4eb6p6l8euol5aeblmhmjdrp396lf.apps.googleusercontent.com
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
